## @section Server
##
## One BareMetalServer per physical server, in tenant-root. It renders the
## Tinkerbell Hardware (DHCP reservation answered by smee) and the BootBoxHost
## (BMC, labels, admitted tenants) in the BootBox namespace. The server's
## name is the release name without the "baremetal-server-" prefix and
## becomes the node hostname.

## @param {string} mac - MAC address of the PXE network interface.
mac: ""

## @typedef {struct} IP - Fixed address handed out by DHCP.
## @field {string} address - IPv4 address.
## @field {string} netmask - Netmask, e.g. 255.255.248.0.
## @field {string} gateway - Default gateway.

## @param {IP} ip - DHCP reservation.
ip:
  address: ""
  netmask: ""
  gateway: ""

## @param {[]string} nameServers - Resolvers handed out by DHCP.
nameServers: []

## @param {[]string} timeServers - NTP servers handed out by DHCP.
timeServers: []

## @param {string} arch="x86_64" - CPU architecture (x86_64 or aarch64).
arch: x86_64

## @param {string} idleIPXEURL - iPXE script URL while the server is not provisioning (the BootBox matchbox script). The provider points the reservation at its own boot server while it provisions.
idleIPXEURL: ""

## @section BMC

## @typedef {struct} BMC - Redfish endpoint of the server.
## @field {string} address - Redfish base URL, e.g. https://10.0.0.10.
## @field {string} [credentialsSecret] - Secret in the BootBox namespace with keys username and password. Defaults to <name>-bmc. Create it by hand; credentials never go into this spec.
## @field {string} [certificateFingerprint] - SHA-256 fingerprint of the BMC certificate (pinning).
## @field {bool} [insecureSkipVerify] - Skip TLS verification when no fingerprint is set.
## @field {string} [systemID] - Redfish ComputerSystem, e.g. System.Embedded.1.

## @param {BMC} bmc - Baseboard management controller.
bmc:
  address: ""
  credentialsSecret: ""
  certificateFingerprint: ""
  insecureSkipVerify: false
  systemID: ""

## @section Scheduling

## @param {map[string]string} labels - Labels on the BootBoxHost; BareMetalNodes pools select hosts by them (bootbox.hostSelector).
labels: {}

## @param {[]string} consumerNamespaces - Tenant namespaces whose pools may claim this server, e.g. tenant-training.
consumerNamespaces: []

## @param {bool} maintenance=true - Keep the server from being claimed. New servers start in maintenance; a claimed server is not affected.
maintenance: true

## @section Machine config

## @typedef {struct} StaticAddress - Static node address written into one link document of the pool's machine config.
## @field {string} address - CIDR, e.g. 172.19.24.36/21.
## @field {string} [link] - Document name, default bond1.
## @field {string} [kind] - Document kind, default BondConfig.

## @param {StaticAddress} staticAddress - Static node address. Empty keeps DHCP.
staticAddress:
  address: ""
  link: bond1
  kind: BondConfig

## @param {[]object} configPatches - Further host-specific JSON merge patches ({kind, name, patch}) for the machine config.
configPatches: []

## @param {[]string} extraKernelArgs - Kernel arguments added to the provisioning boot.
extraKernelArgs: []
