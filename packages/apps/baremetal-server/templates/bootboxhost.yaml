{{- $name := include "baremetal-server.name" . }}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: BootBoxHost
metadata:
  name: {{ $name }}
  namespace: {{ include "baremetal-server.hostNamespace" . }}
  labels:
    {{- include "baremetal-server.appLabels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  hardwareName: {{ $name }}
  maintenance: {{ .Values.maintenance }}
  consumerNamespaces:
    {{- toYaml (.Values.consumerNamespaces | default list) | nindent 4 }}
  bmc:
    address: {{ .Values.bmc.address }}
    credentialsName: {{ .Values.bmc.credentialsSecret | default (printf "%s-bmc" $name) }}
    {{- with .Values.bmc.certificateFingerprint }}
    certificateFingerprint: {{ . }}
    {{- end }}
    {{- if .Values.bmc.insecureSkipVerify }}
    insecureSkipVerify: true
    {{- end }}
    {{- with .Values.bmc.systemID }}
    systemID: {{ . }}
    {{- end }}
  {{- $patches := list }}
  {{- with .Values.staticAddress.address }}
  {{- $patches = append $patches (dict "kind" ($.Values.staticAddress.kind | default "BondConfig") "name" ($.Values.staticAddress.link | default "bond1") "patch" (dict "addresses" (list (dict "address" .)))) }}
  {{- end }}
  {{- $patches = concat $patches (.Values.configPatches | default list) }}
  {{- with $patches }}
  configPatches:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.extraKernelArgs }}
  extraKernelArgs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
