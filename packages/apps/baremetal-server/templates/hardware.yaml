{{- $name := include "baremetal-server.name" . }}
apiVersion: tinkerbell.org/v1alpha1
kind: Hardware
metadata:
  name: {{ $name }}
  namespace: {{ include "baremetal-server.hostNamespace" . }}
  labels:
    {{- include "baremetal-server.appLabels" . | nindent 4 }}
  annotations:
    # netboot is owned by the BootBox provider while the server provisions;
    # Helm only sets it when the chart values change.
    infrastructure.cluster.x-k8s.io/netboot-owner: cluster-api-provider-bootbox
spec:
  interfaces:
    - dhcp:
        hostname: {{ $name }}
        mac: {{ lower .Values.mac | replace "-" ":" }}
        arch: {{ .Values.arch }}
        uefi: true
        lease_time: 86400
        ip:
          address: {{ .Values.ip.address }}
          {{- with .Values.ip.netmask }}
          netmask: {{ . }}
          {{- end }}
          {{- with .Values.ip.gateway }}
          gateway: {{ . }}
          {{- end }}
        {{- with .Values.nameServers }}
        name_servers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.timeServers }}
        time_servers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      netboot:
        allowPXE: false
        {{- with .Values.idleIPXEURL }}
        ipxe:
          url: {{ . }}
        {{- end }}
