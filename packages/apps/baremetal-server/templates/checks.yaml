{{- if ne .Release.Namespace "tenant-root" }}
{{- fail "BareMetalServer can only be created in tenant-root: servers are platform inventory" }}
{{- end }}
{{- $name := include "baremetal-server.name" . }}
{{- if not (regexMatch `^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$` $name) }}
{{- fail (printf "server name %q must be a DNS label (it becomes the hostname)" $name) }}
{{- end }}
{{- if not (regexMatch `^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$` .Values.mac) }}
{{- fail (printf "mac %q is not a MAC address" .Values.mac) }}
{{- end }}
{{- if not .Values.ip.address }}
{{- fail "ip.address is required: smee only answers reserved addresses" }}
{{- end }}
{{- if not (regexMatch `^https?://` .Values.bmc.address) }}
{{- fail "bmc.address must be a Redfish URL, e.g. https://10.0.0.10" }}
{{- end }}
