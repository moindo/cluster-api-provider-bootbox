      "openAPISchema": "{\"title\":\"Chart Values\",\"type\":\"object\",\"properties\":{\"cluster\":{\"description\":\"Name of the parent Kubernetes cluster (the `Kubernetes` CR) in the same namespace this node pool attaches to. Required. The pool's CAPI objects are wired to the parent cluster `kubernetes-<cluster>`; the KubernetesNodes CR must be named `<cluster>-<pool>`. The pool name (the part after `<cluster>-`) must not collide with a nodeGroup still managed by the parent kubernetes chart (e.g. the default `md0`), or the render fails on ownership conflict.\",\"type\":\"string\",\"default\":\"\",\"x-kubernetes-validations\":[{\"rule\":\"self == oldSelf\",\"message\":\"cluster is immutable\"}]},\"minReplicas\":{\"description\":\"Minimum number of replicas in this pool. Used as the cluster-autoscaler floor.\",\"type\":\"integer\",\"default\":0},\"maxReplicas\":{\"description\":\"Maximum number of replicas in this pool. Used as the cluster-autoscaler ceiling.\",\"type\":\"integer\",\"default\":10},\"roles\":{\"description\":\"List of node roles. Each role `r` labels nodes with `node-role.kubernetes.io/<r>`. Use `[ingress-nginx]` for a pool that hosts the tenant ingress-nginx controller.\",\"type\":\"array\",\"default\":[],\"items\":{\"type\":\"string\"}},\"kernelModules\":{\"description\":\"Kernel modules loaded on every worker in this pool, emitted as Talos `machine.kernel.modules`. A Talos system extension installs a module but does not load it, so an extension-provided driver needs its modules declared here. Leave unset to let the chart decide: a pool holding at least one `nvidia.com/*` GPU gets `nvidia` (with `NVreg_NvLinkDisable=1`, which the gpu-operator driver container applies on non-Talos workers; on Talos that container has to be turned off or it clashes with the system extension, and nothing then mounts the ConfigMap carrying the parameter), `nvidia_uvm`, `nvidia_drm`, `nvidia_modeset` (that order \\u2014 Talos loads the list in sequence and the last three depend on the first), and any other pool gets nothing. Set a non-empty list to replace the chart's choice entirely, or `[]` to opt out and emit no modules even on a GPU pool. The field carries no default, and unset is not the same value as `[]`: a generated parameter table that shows `[]` in its Default column is printing what it prints for any array with no default, not the effective value \\u2014 leaving the field out selects the automatic set, writing `[]` disables it. The module still has to be in the image, and which extensions the image carries is the pool's schematic: a GPU pool points `osImage.factory.schematicID` (or `osImage.builtin.schematicID`) at a schematic with the NVIDIA extensions, and on Blackwell (GB202) that must be the open-kernel-modules extension. The automatic set keys on the `nvidia.com/` resource prefix alone and nothing cross-checks it against that schematic; on Talos v1.13 a declared module the image does not ship leaves its controller retrying rather than failing the boot, so the symptom is a missing driver, not a dead node. This value is part of the worker machine config, whose content hash names the `TalosConfigTemplate`, so changing it rolls every existing worker in the pool rather than only affecting nodes created later. The automatic set is itself such a change, on the upgrade that introduces this field, for every existing pool that holds an `nvidia.com/*` GPU and leaves the field unset: that pool rolls.\",\"type\":\"array\",\"items\":{\"type\":\"object\",\"required\":[\"name\"],\"properties\":{\"name\":{\"description\":\"Module name as `modprobe` takes it, e.g. `nvidia_uvm`.\",\"type\":\"string\"},\"parameters\":{\"description\":\"Module parameters, each as a bare `key=value` string.\",\"type\":\"array\",\"items\":{\"type\":\"string\"}}}}},\"kubelet\":{\"description\":\"Kubelet resource reservations for this pool.\",\"type\":\"object\",\"default\":{},\"properties\":{\"evictionHardMemory\":{\"description\":\"Hard eviction threshold for memory (absolute like 200Mi or percentage like 7%).\",\"type\":\"string\",\"default\":\"7%\"},\"evictionSoftMemory\":{\"description\":\"Soft eviction threshold for memory (absolute like 1Gi or percentage like 10%).\",\"type\":\"string\",\"default\":\"10%\"},\"kubeReservedCpu\":{\"description\":\"CPU reserved for kubelet and container runtime. Auto-computed from instanceType if empty.\",\"type\":\"string\"},\"kubeReservedMemory\":{\"description\":\"Memory reserved for kubelet and container runtime. Auto-computed from instanceType if empty.\",\"type\":\"string\"},\"systemReservedCpu\":{\"description\":\"CPU reserved for host OS. Auto-computed from instanceType if empty.\",\"type\":\"string\"},\"systemReservedMemory\":{\"description\":\"Memory reserved for host OS. Auto-computed from instanceType if empty.\",\"type\":\"string\"}}},\"maxUnhealthy\":{\"description\":\"Maximum number of unhealthy nodes tolerated in this pool before remediation is paused. The MachineHealthCheck admission webhook accepts either a bare integer (\\\"0\\\", \\\"1\\\", ...) or a percentage (\\\"0%\\\", \\\"50%\\\"); bare numeric strings are rejected, so the safer default is a percentage. Drop to \\\"0%\\\" once the pool is stable. Watch how a percentage behaves in a small group: the MachineHealthCheck controller scales it against the number of machines the check covers and rounds down, then remediates only while the unhealthy count is at or below that result. At \\\"50%\\\" a group of one therefore never remediates, because half of one rounds down to zero, and a group of two remediates one unhealthy machine but not two.\",\"type\":\"string\",\"default\":\"50%\"},\"nodeStartupTimeout\":{\"description\":\"Maximum time a Machine is allowed to spend reaching the Ready condition before it is remediated. Raise for slow first boots (Talos image fetch from factory.talos.dev or a busy storage class on the kubevirt-csi PVC populator). The MachineHealthCheck measures it from the later of the Machine's creation and its InfrastructureReady transition, so the clock restarts when the infrastructure reports ready: a worker gets this long for the disk image import and the VM to come up, and then this long again for the guest to boot and its kubelet to register with the tenant apiserver. Either leg stretches on a host under load, and a Machine remediated here is deleted before it ever joins, so its replacement starts the same sequence from the beginning.\",\"type\":\"string\",\"default\":\"20m\"},\"readyUnknownTimeout\":{\"description\":\"How long a worker Node may report `Ready=Unknown` before the MachineHealthCheck remediates the Machine, which for a KubeVirt worker means deleting the VM. `Ready=Unknown` is what the node lifecycle controller writes once it stops hearing from a kubelet, on a grace period of its own, so the wall clock from a guest going quiet to a deleted worker is this value plus that grace period. A guest starved of CPU stops answering long before it is dead, so a value of a few tens of seconds deletes workers that would have come back on their own. Validated at render time like maxNodeProvisionTime: the CAPI webhook does not check these timeouts, and a zero or negative value would remediate the moment the condition flips. Keep in sync with the parent kubernetes chart.\",\"type\":\"string\",\"default\":\"5m\"},\"readyFalseTimeout\":{\"description\":\"How long a worker Node may report `Ready=False` before the MachineHealthCheck remediates the Machine. A Node that has registered but has no working CNI yet reports `Ready=False`, so this value is the whole budget a first boot gets for the CNI rollout to reach that node, and a worker deleted mid-rollout takes the rollout with it while its replacement starts over. Raising it delays replacing a worker that is genuinely dead, but not rescheduling its workload: Pods leave an unreachable Node on the node lifecycle controller's taint-based eviction and the toleration that carries, not on this timer. Validated at render time like maxNodeProvisionTime: the CAPI webhook does not check these timeouts, and a zero or negative value would remediate the moment the condition flips. Keep in sync with the parent kubernetes chart.\",\"type\":\"string\",\"default\":\"10m\"},\"maxNodeProvisionTime\":{\"description\":\"How long the cluster-autoscaler waits for a newly created worker to register as a Node before it treats that machine as long-unregistered. Rendered onto this pool's MachineDeployment as the `cluster.x-k8s.io/autoscaling-options-maxnodeprovisiontime` annotation, which overrides the autoscaler's built-in default for this pool only. Two things change when the timer fires, and both make a slow join worse rather than better: the machine stops counting towards the pool's upcoming capacity, so the autoscaler asks for a replacement for capacity that is already on its way, and the machine becomes eligible for removal. Size it above the slowest join a healthy worker can take, counting the Talos image import, the guest boot and the CNI rollout. Accepted as a whole number of seconds, minutes or hours (\\\"30m\\\", \\\"1h30m\\\"), which is narrower than Go's duration syntax on purpose: the autoscaler ignores a value it cannot parse and falls back to its own default without failing, and the narrower shape cannot express a value that overflows the parser or a fraction it rounds to zero. The canonical form a duration serializes back to (\\\"20m0s\\\", \\\"1h0m0s\\\") is accepted. Keep in sync with the parent kubernetes chart.\",\"type\":\"string\",\"default\":\"30m\"},\"version\":{\"description\":\"Kubernetes major.minor version the pool joins. Must not be ahead of the parent cluster's minor (workers may not lead the apiserver); it may lag behind during a rolling upgrade -- bump the parent Kubernetes CR first, then each pool -- and must satisfy the Talos<->Kubernetes support matrix against `talos.version`.\",\"type\":\"string\",\"default\":\"v1.35\",\"enum\":[\"v1.35\",\"v1.34\",\"v1.33\",\"v1.32\",\"v1.31\"]},\"talos\":{\"description\":\"Talos worker image configuration. Keep in sync with the parent cluster's `talos`.\",\"type\":\"object\",\"default\":{},\"required\":[\"imageFactoryURL\",\"installerRepository\",\"registryMirrors\",\"schematicID\",\"version\"],\"properties\":{\"imageFactoryCA\":{\"description\":\"Complete PEM certificate block(s) CDI must trust when importing this pool's worker OS disk image over HTTPS \\u2014 the no-osImage default and `osImage.factory` path. Empty by default, so the importer uses only its system trust store, which is what the public factory needs. Set this when the factory in use (`imageFactoryURL` or `osImage.factory.imageFactoryURL`) is a self-hosted factory or mirror served by an internal CA, which the importer otherwise rejects with `x509: certificate signed by unknown authority`. The chart renders it into a ConfigMap in the release namespace \\u2014 CDI requires certConfigMap to sit alongside the DataVolume \\u2014 and references that from the worker DataVolume's `source.http.certConfigMap`; CDI appends it to the system pool rather than replacing it, so a publicly-trusted endpoint verifies either way. A pool on `osImage.builtin` clones a golden image and builds no HTTP source, so this field has no effect there.\",\"type\":\"string\",\"default\":\"\"},\"imageFactoryURL\":{\"description\":\"Default base URL of the Talos Image Factory that serves the worker OS disk image (the `openstack-amd64.raw.xz` raw artifact streamed in by CDI over HTTP). Applies only when this pool imports over HTTP \\u2014 the default and `osImage.factory`, which overrides it via `osImage.factory.imageFactoryURL`. A pool on `osImage.builtin` clones a golden image from the worker image catalog and does not use this field at all. Defaults to the public factory. Point at a self-hosted Image Factory, a caching mirror, or an internal HTTP file server for air-gapped, rate-limited, or flaky-egress environments. No trailing slash. It is interpolated into the worker DataVolume source URL, so on those HTTP paths it must be a plain `http(s)` URL and the render refuses anything else; a pool on `osImage.builtin` builds no such URL and is not held to it, so blanking this field there is legal.\",\"type\":\"string\",\"default\":\"https://factory.talos.dev\"},\"installerRepository\":{\"description\":\"OCI repository prefix for the Talos installer image used by the in-guest `talos-reconcile` upgrade Job. Resolved as `<installerRepository>/<schematicID>:<version>` against whatever this pool's `osImage` pins, falling back to `talos.schematicID` and `talos.version` \\u2014 so the installer matches the OS the pool actually booted. The prefix itself has no `osImage.*` override, so an air-gapped pool needs it pointed at a reachable registry as well. Defaults to the public factory's installer path. Override for air-gapped or mirrored registries. No trailing slash.\",\"type\":\"string\",\"default\":\"factory.talos.dev/installer\"},\"registryMirrors\":{\"description\":\"Talos `machine.registries.mirrors` passthrough for worker nodes: a map of upstream registry host to `{ endpoints: [ ... ] }`. Empty by default, so workers pull container images (the Talos `kubelet` image included) directly from the upstream registry. Point a host such as `ghcr.io` at an in-cluster pull-through mirror for air-gapped, rate-limited, or flaky-egress environments so a worker's boot does not depend on live public egress. Talos still falls back to the upstream registry unless a host also sets `skipFallback: true`, so a mirror alone does not enforce air-gap. This value is part of the worker machine config, whose content hash names the TalosConfigTemplate, so changing it rolls every existing worker in the pool rather than only affecting nodes created later.\",\"type\":\"object\",\"default\":{},\"x-kubernetes-preserve-unknown-fields\":true},\"schematicID\":{\"description\":\"Talos image-factory schematic ID. Defaults to the cozystack-tested vanilla schematic. Operators using custom schematics (system extensions, kernel args) override here. The pool can pin its own via `osImage.builtin.schematicID` or `osImage.factory.schematicID`; when `osImage` omits it, this value applies. Whichever of the two applies is interpolated into an image URL and a DataVolume name, so it must be a plain lowercase alphanumeric identifier -- the render refuses anything else. A custom schematic on `osImage.builtin` also needs its own catalog entry, since the golden is named from the schematic ID.\",\"type\":\"string\",\"default\":\"ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515\"},\"version\":{\"description\":\"Default Talos release for this pool's worker OS image and in-guest installer. The pool can pin its own release via `osImage.builtin.version` or `osImage.factory.version`; when `osImage` omits it, this value applies. Both ways in are checked against the chart's Talos<->Kubernetes support matrix, against whichever release the pool actually resolves to, so an override cannot slip past a check `talos.version` would have failed. The matrix rejects a pairing it lists as unsupported; it lists the Talos minors this chart ships and passes any other minor unchecked, so pointing either field at a Talos release the chart does not know about is the operator's call, not a checked one. Whichever release applies is interpolated into an image URL and a DataVolume name, so it must be a full `vMAJOR.MINOR.PATCH` release, optionally with a pre-release suffix -- the render refuses anything else, a minor-only `v1.13` included. The values schema types this as a bare string, so a malformed one is accepted by the CR and fails the pool's HelmRelease instead.\",\"type\":\"string\",\"default\":\"v1.13.6\"}}},\"bootbox\":{\"description\":\"Bare-metal substrate settings. Ignored unless `substrate` is `bootbox`.\",\"type\":\"object\",\"default\":{},\"properties\":{\"hostSelector\":{\"type\":\"object\",\"default\":{},\"additionalProperties\":{\"type\":\"string\"},\"description\":\"Labels a BootBoxHost must carry to be claimed by this pool. Hosts also have to admit the pool's namespace (spec.consumerNamespaces). Required.\"},\"dnsServers\":{\"description\":\"Nameservers written into the worker machineconfig. Required.\",\"type\":\"array\",\"default\":[],\"items\":{\"type\":\"string\"}},\"apiServerAddress\":{\"description\":\"IPv4 address the servers reach the tenant apiserver on. Empty uses the LoadBalancer address of the control-plane Service.\",\"type\":\"string\",\"default\":\"\"},\"nodeSubnets\":{\"description\":\"CIDRs the kubelet picks its node IP from on multi-homed servers.\",\"type\":\"array\",\"default\":[],\"items\":{\"type\":\"string\"}},\"installDiskSelector\":{\"type\":\"object\",\"default\":{},\"additionalProperties\":{\"type\":\"string\"},\"description\":\"Talos install disk selector (e.g. model). Takes precedence over installDisk.\"},\"installDisk\":{\"description\":\"Install disk path when no selector is set. Defaults to /dev/sda.\",\"type\":\"string\",\"default\":\"\"},\"sysctls\":{\"type\":\"object\",\"default\":{},\"additionalProperties\":{\"type\":\"string\"},\"description\":\"Extra kernel sysctls.\"},\"extraDocuments\":{\"description\":\"Additional Talos machine config documents (multi-document YAML), e.g. a BondConfig. Host-specific values belong in the BootBoxHost configPatches.\",\"type\":\"string\",\"default\":\"\"}}}}}"
