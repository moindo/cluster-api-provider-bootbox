apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  labels:
    control-plane: controller-manager
spec:
  # One replica: the BMC network attachment usually carries a static address.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: controller:latest
          args:
            - --leader-elect
            - --host-namespace=$(HOST_NAMESPACE)
            # Site-specific, set by an overlay:
            # - --boot-base-url=http://pxe.example.com/capi
            # - --kernel-url=http://pxe.example.com/assets/vmlinuz
            # - --initrd-url=http://pxe.example.com/assets/initramfs.xz
            # - --idle-ipxe-url=http://pxe.example.com/boot.ipxe
          env:
            - name: HOST_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - {name: boot, containerPort: 8082}
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: boot
spec:
  selector:
    control-plane: controller-manager
  ports:
    - {name: http, port: 80, targetPort: boot}
