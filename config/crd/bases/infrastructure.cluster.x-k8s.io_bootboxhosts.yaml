  names:
    categories:
    - cluster-api
    kind: BootBoxHost
    listKind: BootBoxHostList
    plural: bootboxhosts
    shortNames:
    - bbh
    singular: bootboxhost
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.consumerRef.name
      name: Consumer
      type: string
    - jsonPath: .status.hardware.powerState
      name: Power
      type: string
    - jsonPath: .status.hardware.model
      name: Model
      type: string
    - jsonPath: .spec.maintenance
      name: Maintenance
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BootBoxHost is a bare-metal server that BootBoxMachines can claim.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BootBoxHostSpec defines a bare-metal server known to BootBox.
            properties:
              bmc:
                description: BMC is the Redfish endpoint of the server.
                properties:
                  address:
                    description: Address is the Redfish base URL, for example https://10.0.0.10.
                    pattern: ^https?://
                    type: string
                  certificateFingerprint:
                    description: |-
                      CertificateFingerprint pins the BMC's TLS certificate by the SHA-256
                      fingerprint of its leaf certificate (hex, colons optional). BMCs
                      usually present self-signed certificates; pinning avoids disabling
                      verification altogether.
                    type: string
                  credentialsName:
                    description: |-
                      CredentialsName names a Secret in the host's namespace with the keys
                      "username" and "password".
                    minLength: 1
                    type: string
                  insecureSkipVerify:
                    description: |-
                      InsecureSkipVerify disables TLS verification. Ignored when
                      CertificateFingerprint is set.
                    type: boolean
                  systemID:
                    description: |-
                      SystemID selects the Redfish ComputerSystem, for example
                      System.Embedded.1. Defaults to the first system.
                    type: string
                required:
                - address
                - credentialsName
                type: object
              configPatches:
                description: |-
                  ConfigPatches are host-specific changes to the Talos machine config,
                  for example static addresses.
                items:
                  description: |-
                    ConfigPatch is a JSON merge patch (RFC 7386) applied to the documents of
                    the Talos machine config served to this host.
                  properties:
                    kind:
                      description: |-
                        Kind selects the documents by kind, for example BondConfig.
                        "v1alpha1" selects the legacy v1alpha1 document.
                      minLength: 1
                      type: string
                    name:
                      description: Name restricts the match to the document with this
                        name.
                      type: string
                    patch:
                      description: Patch is the merge patch.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - kind
                  - patch
                  type: object
                type: array
              consumerNamespaces:
                description: |-
                  ConsumerNamespaces lists the namespaces whose BootBoxMachines may claim
                  this host. Hosts with an empty list cannot be claimed.
                items:
                  type: string
                type: array
              extraKernelArgs:
                description: |-
                  ExtraKernelArgs are appended to the kernel command line of the
                  provisioning boot.
                items:
                  type: string
                type: array
              hardwareName:
                description: |-
                  HardwareName names the Tinkerbell Hardware object (same namespace)
                  that holds the server's DHCP reservation. The provider points its
                  iPXE URL at the provisioning endpoint while the host provisions.
                minLength: 1
                type: string
              hostname:
                description: |-
                  Hostname of the node. Defaults to the hostname of the Hardware DHCP
                  reservation, then to the object name.
                type: string
              maintenance:
                description: |-
                  Maintenance keeps the host from being claimed. A claimed host is not
                  affected.
                type: boolean
            required:
            - bmc
            - hardwareName
            type: object
          status:
            description: BootBoxHostStatus is the observed state of a BootBoxHost.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consumerRef:
                description: ConsumerRef is the BootBoxMachine that claimed the host.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              hardware:
                description: HardwareInfo is what the BMC reports about the server.
                properties:
                  biosVersion:
                    type: string
                  manufacturer:
                    type: string
                  model:
                    type: string
                  powerState:
                    type: string
                  serialNumber:
                    type: string
                type: object
              lastInspected:
                description: LastInspected is the time of the last successful BMC
                  inspection.
                format: date-time
                type: string
              provisioning:
                description: ProvisioningStatus tracks the provisioning boot.
                properties:
                  bootAttempts:
                    description: BootAttempts counts PXE boot requests of the current
                      provisioning.
                    format: int32
                    type: integer
                  bootRequestedAt:
                    description: BootRequestedAt is when the PXE boot was requested
                      from the BMC.
                    format: date-time
                    type: string
                  configServedAt:
                    description: ConfigServedAt is when the host fetched its machine
                      config.
                    format: date-time
                    type: string
                  ipxeServedAt:
                    description: |-
                      IPXEServedAt is when the host first fetched its iPXE script. Only that
                      first boot carries the disk wipe: Talos reboots after wiping.
                    format: date-time
                    type: string
                type: object
              state:
                description: HostState is the lifecycle state of a BootBoxHost.
                enum:
                - ""
                - Available
                - Provisioning
                - Provisioned
                - Deprovisioning
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
