name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated files are up to date
        run: make generate && git diff --exit-code
      - run: make test

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - name: Render kubernetes-nodes with the bootbox substrate
        run: helm template kubernetes-nodes-training-gpu packages/apps/kubernetes-nodes --namespace tenant-training --values packages/apps/kubernetes-nodes/tests/values-bootbox.yaml | python3 hack/check-yaml.py
      - name: Render kubernetes-nodes bootbox with the API's kubelet defaults
        run: |
          printf 'kubelet:\n  evictionHardMemory: "7%%"\n  evictionSoftMemory: "10%%"\n' > /tmp/kubelet.yaml
          helm template kubernetes-nodes-training-gpu packages/apps/kubernetes-nodes --namespace tenant-training --values packages/apps/kubernetes-nodes/tests/values-bootbox.yaml --values /tmp/kubelet.yaml | python3 hack/check-yaml.py
      - name: Render the baremetal module
        run: helm template baremetal packages/apps/baremetal --namespace tenant-root --values packages/apps/baremetal/tests/values-cozykite.yaml | python3 hack/check-yaml.py
      - name: Render the provider chart
        run: helm template capi-bootbox packages/system/cluster-api-provider-bootbox --namespace cozy-bootbox --values packages/system/cluster-api-provider-bootbox/tests/values-cozykite.yaml | python3 hack/check-yaml.py
      - name: Generated charts are up to date
        run: |
          python3 hack/gen-provider-chart.py packages/system/cluster-api-provider-bootbox
          make -C packages/system/kubernetes-nodes-rd generate
          make -C packages/system/baremetal-rd generate
          git diff --exit-code

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
